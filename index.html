<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAY ROBLOX WITH ME!!!!! :D</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #2e1065 0%, #090a0f 100%);
      overflow: hidden;
      position: relative;
    }

    /* Envelope Landing Screen */
    .envelope-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d11;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .envelope-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Realistic Realistic CSS Envelope Structure */
    .envelope-wrapper {
      position: relative;
      width: 300px;
      height: 200px;
      background: #181124;
      border-radius: 12px;
      border: 2px solid #a855f7;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    .envelope-wrapper:hover {
      transform: scale(1.06) rotate(-1deg);
      box-shadow: 0 0 45px rgba(236, 72, 153, 0.8);
    }

    /* Envelope Top Flap */
    .envelope-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 110px solid #2a1644;
      z-index: 2;
    }

    /* Envelope Bottom Side Folds */
    .envelope-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid #1f1333;
      border-right: 150px solid #231539;
      border-bottom: 100px solid #271740;
      z-index: 1;
    }

    /* Envelope Wax/Heart Seal */
    .envelope-seal {
      position: absolute;
      top: 95px;
      z-index: 3;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.9);
      color: white;
      font-size: 1.2rem;
      font-weight: 900;
      animation: sealPulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes sealPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .closed-content {
      position: absolute;
      bottom: 12px;
      z-index: 4;
      text-align: center;
      color: #e0aaff;
      font-size: 1rem;
      font-weight: 900;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }

    /* Flash Overlay for Chaos */
    .flash-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(236, 72, 153, 0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 99999999;
      transition: opacity 0.05s ease-out;
    }

    /* Ambient Pulsing Background Glow */
    .bg-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.5) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      animation: crazyGlow 1.5s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes crazyGlow {
      0% { transform: scale(0.7) rotate(0deg); }
      100% { transform: scale(1.6) rotate(180deg); }
    }

    /* Main Card / Game Area */
    .main-card {
      background: #1a0b2e;
      border: 4px solid #a855f7;
      border-radius: 24px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: white;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.8);
      z-index: 10;
    }

    .main-card h2 {
      font-size: 1.8rem;
      margin-bottom: 25px;
      color: #f3e8ff;
      text-shadow: 0 0 15px #a855f7;
      animation: pulseText 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulseText {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 50px;
      width: 100%;
    }

    button {
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: 900;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }

    .yes-btn {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      color: white;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.9);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .yes-btn:hover {
      transform: scale(1.3) rotate(-5deg);
    }

    /* Slippery NO Button */
    .no-btn {
      background: #0f172a;
      color: #38bdf8;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.8);
      z-index: 9999999 !important;
      position: relative;
      transition: left 0.1s ease-out, top 0.1s ease-out, transform 0.1s ease;
    }

    /* Spawned YES Blocker Buttons */
    .blocker-yes {
      position: fixed;
      z-index: 1000;
      background: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
      color: white;
      box-shadow: 0 0 25px rgba(168, 85, 247, 1);
      animation: chaoticPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), wobbleFloat 2s ease-in-out infinite alternate;
    }

    @keyframes chaoticPop {
      0% { transform: scale(0) rotate(-45deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes wobbleFloat {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-10px) rotate(5deg); }
    }

    /* Floating Particles & Begging Text */
    .laugh-smiley {
      position: fixed;
      z-index: 1000000;
      background: #ec4899;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(236, 72, 153, 1);
      pointer-events: none;
      animation: burstFloat 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes burstFloat {
      0% { transform: scale(0) translateY(0) rotate(-20deg); opacity: 0; }
      20% { transform: scale(1.3) translateY(-15px) rotate(10deg); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: scale(0.7) translateY(-70px) rotate(20deg); opacity: 0; }
    }

    /* Click Ripple Effect */
    .click-ripple {
      position: fixed;
      width: 30px;
      height: 30px;
      border: 4px solid #f0abfc;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999999;
      animation: expandRipple 0.6s ease-out forwards;
    }

    @keyframes expandRipple {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(12); opacity: 0; }
    }

    /* Modals & Yandere Overlay */
    .modal-overlay, .yandere-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 5, 20, 0.94);
      backdrop-filter: blur(14px);
      justify-content: center;
      align-items: center;
      z-index: 10000000;
    }

    .modal-content {
      background: #1e1035;
      padding: 45px 60px;
      border-radius: 32px;
      text-align: center;
      color: #fff;
      border: 4px solid #ec4899;
      box-shadow: 0 0 70px rgba(236, 72, 153, 1);
      animation: explosionModal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes explosionModal {
      0% { transform: scale(0.1) rotate(-30deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .modal-content h1 {
      font-size: 2.8rem;
      color: #f0abfc;
      text-shadow: 0 0 25px #ec4899;
      margin-bottom: 20px;
    }

    .yandere-hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Envelope Landing Screen -->
  <div class="envelope-screen" id="envelopeScreen">
    <div class="envelope-wrapper" onclick="openEnvelopeScreen(event)">
      <div class="envelope-seal">★</div>
      <div class="closed-content">
        <p>YOU HAVE A MESSAGE!<br><small style="color: #c084fc; font-size: 0.85rem;">(Click to open :D)</small></p>
      </div>
    </div>
  </div>

  <div class="flash-overlay" id="flashOverlay"></div>
  <div class="bg-glow"></div>

  <!-- Main Game Card -->
  <div class="main-card">
    <h2>DO YAW WANNA PLAY ROBLOX W ME? :D</h2>
    <div class="btn-container">
      <button class="yes-btn" onclick="celebrateYay(event)">YES!</button>
      <button class="no-btn" id="noBtn" onmouseenter="neverEndingDodge(event)" onclick="celebrateYay(event)">NO</button>
    </div>
  </div>

  <!-- Yandere Exit Warning Modal -->
  <div class="yandere-overlay yandere-hidden" id="yandereOverlay">
    <div class="modal-content">
      <h1>LEAVING SO SOON?!</h1>
      <p style="color: #e9d5ff; font-size: 1.3rem; margin-bottom: 25px;">YOU CAN'T LEAVE UNTIL WE PLAY ROBLOX!</p>
      <div style="display: flex; gap: 20px; justify-content: center;">
        <button class="yes-btn" id="yandereStayBtn">OKAY I'LL STAY!</button>
        <button class="no-btn" id="yandereLeaveBtn" style="position: static;">LEAVE 🏃‍♂️</button>
      </div>
    </div>
  </div>

  <!-- Final Victory Modal -->
  <div class="modal-overlay" id="yayModal">
    <div class="modal-content">
      <h1>YAYYY NOW DM ME FR FR!! :D</h1>
      <p style="color: #e9d5ff; font-size: 1.3rem; margin-bottom: 25px;">TEXT ME RIGHT NOW ON DISCORD/DMs!</p>
      <button class="yes-btn" style="font-size: 1.5rem; padding: 16px 36px;" onclick="closeModal(event)">LET'S GOOO!</button>
    </div>
  </div>

  <script>
    let moveLeft = true;
    let audioCtx = null;

    const creepyLaughs = [
      "PLEASEEEE", "WHY NOOO?", "COME ONNN", "ROBLOX TIME!",
      "JUST SAY YES", "NO IS NOT AN OPTION", "HAHAHA >:D", "HEHEHE ;)", "PRETTY PLEASE", "ACCEPT YOUR DESTINY"
    ];

    // Screen Shake & Flash
    function triggerChaos() {
      const shakeX = (Math.random() * 24 - 12);
      const shakeY = (Math.random() * 24 - 12);
      const rot = (Math.random() * 6 - 3);
      document.body.style.transform = `translate(${shakeX}px, ${shakeY}px) rotate(${rot}deg)`;
      setTimeout(() => { document.body.style.transform = 'translate(0,0) rotate(0deg)'; }, 60);

      const flash = document.getElementById('flashOverlay');
      flash.style.opacity = '1';
      setTimeout(() => { flash.style.opacity = '0'; }, 80);
    }

    // Visual Click Ripple Effect
    function createRipple(e) {
      if (!e) return;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = `${e.clientX - 15}px`;
      ripple.style.top = `${e.clientY - 15}px`;
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    // Audio Synthesizer
    function playLaserSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(900, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function playExplosionSound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playVictorySound() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.07);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.07 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.07);
        osc.stop(audioCtx.currentTime + i * 0.07 + 0.4);
      });
    }

    // Open Envelope Landing Screen
    function openEnvelopeScreen(e) {
      createRipple(e);
      playExplosionSound();
      triggerChaos();

      const screen = document.getElementById('envelopeScreen');
      screen.classList.add('hidden');
    }

    function spawnSmiley(x, y) {
      const count = Math.floor(Math.random() * 3) + 2;
      for (let i = 0; i < count; i++) {
        const smiley = document.createElement('div');
        smiley.className = 'laugh-smiley';
        smiley.innerText = creepyLaughs[Math.floor(Math.random() * creepyLaughs.length)];
        
        const offsetX = (Math.random() * 160 - 80);
        const offsetY = (Math.random() * 80 - 40);

        smiley.style.left = `${x + offsetX}px`;
        smiley.style.top = `${y + offsetY}px`;
        document.body.appendChild(smiley);
        setTimeout(() => smiley.remove(), 1000);
      }
    }

    function neverEndingDodge(e) {
      if (e) e.stopPropagation();
      playLaserSound();
      triggerChaos();

      const noBtn = document.getElementById('noBtn');
      const rect = noBtn.getBoundingClientRect();

      spawnSmiley(rect.left, rect.top);

      // Spawn TWO YES Blocker Buttons
      for (let i = 0; i < 2; i++) {
        const blocker = document.createElement('button');
        blocker.innerText = 'YES!';
        blocker.className = 'yes-btn blocker-yes';
        
        const spreadX = rect.left + (i * 20 - 10);
        const spreadY = rect.top + (i * 15 - 7);
        
        blocker.style.left = `${spreadX}px`;
        blocker.style.top = `${spreadY}px`;
        blocker.onclick = celebrateYay;
        document.body.appendChild(blocker);
      }

      noBtn.style.position = 'fixed';

      const padding = 30;
      const btnWidth = 120;
      const btnHeight = 55;

      const minX = padding;
      const maxX = window.innerWidth - btnWidth - padding;
      const minY = padding;
      const maxY = window.innerHeight - btnHeight - padding;

      let newX;
      if (moveLeft) {
        newX = minX + Math.random() * (window.innerWidth / 2 - btnWidth);
        moveLeft = false;
      } else {
        newX = (window.innerWidth / 2) + Math.random() * (window.innerWidth / 2 - btnWidth - padding);
        moveLeft = true;
      }

      newX = Math.max(minX, Math.min(maxX, newX));
      const newY = Math.max(minY, Math.min(maxY, Math.random() * (window.innerHeight - btnHeight - padding)));

      const rot = Math.floor(Math.random() * 60) - 30;
      const scale = (0.8 + Math.random() * 0.6).toFixed(2);

      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
      noBtn.style.transform = `rotate(${rot}deg) scale(${scale})`;
    }

    function celebrateYay(e) {
      if (e) e.stopPropagation();
      createRipple(e);
      playVictorySound();
      triggerChaos();

      const end = Date.now() + (2 * 1000);
      const colors = ['#a855f7', '#ec4899', '#3b82f6', '#f0abfc'];

      (function frame() {
        confetti({
          particleCount: 8, angle: 60, spread: 55, origin: { x: 0 }, colors: colors
        });
        confetti({
          particleCount: 8, angle: 120, spread: 55, origin: { x: 1 }, colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());

      document.getElementById('yayModal').style.display = 'flex';
    }

    function closeModal(e) {
      if (e) createRipple(e);
      document.getElementById('yayModal').style.display = 'none';
    }

    // --- Yandere Exit Logic ---
    const yandereOverlay = document.getElementById('yandereOverlay');
    const yandereStayBtn = document.getElementById('yandereStayBtn');
    const yandereLeaveBtn = document.getElementById('yandereLeaveBtn');

    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
      yandereOverlay.classList.remove('yandere-hidden');
      yandereOverlay.style.display = 'flex';
    });

    // Trick Leave button on hover
    yandereLeaveBtn.addEventListener('mouseenter', () => {
      yandereLeaveBtn.innerText = 'NO STAY!';
      setTimeout(() => {
        yandereLeaveBtn.innerHTML = 'LEAVE 🏃‍♂️';
      }, 400);
    });

    yandereStayBtn.addEventListener('click', (e) => {
      yandereOverlay.style.display = 'none';
      celebrateYay(e);
    });

    yandereLeaveBtn.addEventListener('click', (e) => {
      yandereOverlay.style.display = 'none';
      celebrateYay(e);
    });
  </script>
</body>
</html>
